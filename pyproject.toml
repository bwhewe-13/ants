[build-system]
requires = ["setuptools>=77", "cython", "numpy", "tqdm"]
build-backend = "setuptools.build_meta"

[project]
name = "ants-sn"
authors = [
    {name = "Ben Whewell", email = "ben.whewell@pm.me"}
]
description = "Discrete ordinates (S_N) neutron transport in Cython"
version = "0.3.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "cython",
    "numpy",
    "scipy",
    "tqdm",
]

[project.urls]
Documentation = "https://bwhewe-13.github.io/ants/"
Source = "https://github.com/bwhewe-13/ants"
Changelog = "https://github.com/bwhewe-13/ants/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "pre-commit",
    "nbclient",
    "ipykernel",
    "matplotlib",
]
library = [
    "h5py",
]
docs = [
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-tikz",
    "pydata-sphinx-theme",
    "nbsphinx",
    "ipython",
]

# ants/sources holds local data that is not distributed
[tool.setuptools.packages.find]
include = ["ants*"]
exclude = ["ants.sources*"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "*-manylinux_i686", "*-win32"]
test-requires = ["pytest"]
# Run the smoke tests from a copy so the source tree is not imported
test-command = [
    "python {project}/scripts/copy_tests.py {project}",
    "pytest tests -m smoke -p no:cacheprovider",
]

[tool.cibuildwheel.macos]
before-all = "brew install libomp"

[tool.pytest.ini_options]
python_files = ["test_*"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "smoke: All critical smoke tests",
    "slab1d: One-dimensional slab problems",
    "sphere1d: One-dimensional sphere problems",
    "source_iteration: Checks scalar and angular flux calculations",
    "power_iteration: Checks scalar flux and keffective calculations",
    "time_dependent: Runs time dependent problems",
    "bdf1: Runs Backward Euler time dependent problems",
    "cn: Runs Crank Nicolson time dependent problems",
    "bdf2: Runs Backward Differentiation Formula 2 time dependent problems",
    "trbdf2: Runs Trapezoidal Step Backward Differentiation Formula 2",
    "hybrid: Runs hybrid method",
    "multigroup1d: Higher number of energy groups (G = 87, 618) - longer times",
    "multigroup2d: Higher number of energy groups (G = 87, 618) - longer times",
    "slab2d: Two-dimensional slab problems",
    "slab3d: Three-dimensional slab problems",
    "cylinder2d: Two-dimensional cylinder (circular) problems",
    "dimensions: Check the different dimensions of external and boundary sources",
    "math: test math functions - interpolation, error estimation, etc.",
    "nearby1d: One-dimensional nearby problems",
    "nearby2d: Two-dimensional nearby problems",
    "anisotropic: Anisotropic (Legendre P_N) scattering",
    "notebooks: Runs the example Jupyter notebooks",
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
    build
    |ants\.egg-info
    |docs/_build
)/
'''

[tool.isort]
profile = "black"
py_version = 39
skip_glob = ["build/**", "ants.egg-info/**", "docs/_build/**"]
